<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="admin.title">Admin — Fanwaner</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <img src="/img/logo.svg" alt="Fanwaner Logo" />
      <span><span data-i18n="brand.name"></span><span data-i18n="admin.brandSuffix"></span><small data-i18n="admin.brandSub"></small></span>
    </a>
    <nav class="nav">
      <span class="lang-switch" data-lang-switch></span>
      <a class="btn btn-sm btn-ghost" href="/" data-i18n="admin.backToSite"></a>
    </nav>
  </header>

  <main>
    <div id="login-box" class="card-panel" style="max-width:420px; margin-top:60px;">
      <h2 data-i18n="admin.loginTitle"></h2>
      <p class="lead" data-i18n="admin.loginLead"></p>
      <div class="field">
        <input type="password" id="admin-key" data-i18n-ph="admin.loginPlaceholder" />
      </div>
      <button class="btn btn-primary" id="btn-login" style="width:100%;" data-i18n="admin.loginBtn"></button>
      <div class="form-error" id="login-error" style="margin-top:12px;"></div>
    </div>

    <div id="admin-panel" class="hidden">
      <h2 class="section-title">
        <span data-i18n="admin.pendingTitle"></span>
        <small data-i18n="admin.pendingSub"></small>
      </h2>
      <div id="pending-wrap"></div>

      <h2 class="section-title" style="margin-top:46px;" data-i18n="admin.removeBowlSection"></h2>
      <div class="card-panel" style="max-width:640px; margin:0;">
        <div class="field">
          <label for="bowl-slug" data-i18n="admin.slugLabel"></label>
          <input type="text" id="bowl-slug" data-i18n-ph="admin.slugPlaceholder" />
        </div>
        <div class="btn-row">
          <button class="btn" id="btn-find-bowl" data-i18n="admin.lookup"></button>
        </div>
        <div id="bowl-result"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p data-i18n="admin.footerNote"></p>
  </footer>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
