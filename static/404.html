<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="error404.title">Nothing here — Fanwaner</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <img src="/img/logo.svg" alt="Fanwaner Logo" />
      <span><span data-i18n="brand.name"></span><small data-i18n="brand.tagline"></small></span>
    </a>
    <nav class="nav">
      <span class="lang-switch" data-lang-switch></span>
    </nav>
  </header>

  <main>
    <div class="notfound">
      <img class="tilted-bowl" src="/img/bowl.svg" alt="An empty bowl tipped over" />
      <div class="roll-rice">🍚</div>
      <h1 data-i18n="error404.heading"></h1>
      <p data-i18n="error404.sub"></p>
      <div class="btn-row" style="justify-content:center;">
        <a class="btn btn-primary" href="/" data-i18n="nav.home"></a>
        <a class="btn" href="/#bowls" data-i18n="nav.browse"></a>
      </div>
      <p class="small" data-i18n="error404.foot"></p>
    </div>
  </main>

  <footer class="site-footer">
    <p data-i18n="brand.footerTagline"></p>
    <p data-i18n="brand.footerNote1"></p>
    <p data-i18n="brand.footerNote2"></p>
  </footer>

  <script src="/js/i18n.js"></script>
</body>
</html>
