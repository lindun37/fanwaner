<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fanwaner — Broke? Put out a rice bowl.</title>
  <meta name="description" content="An open-source online rice bowl for people on the internet. Put out a bowl, wait for someone kind to chip in." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="__OG_TITLE__" />
  <meta property="og:description" content="__OG_DESC__" />
  <meta property="og:image" content="__OG_IMAGE__" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="__OG_URL__" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:locale:alternate" content="zh_CN" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <img src="/img/logo.svg" alt="Fanwaner Logo" data-i18n-aria="brand.name" />
      <span><span data-i18n="brand.name"></span><small data-i18n="brand.tagline"></small></span>
    </a>
    <nav class="nav">
      <span class="lang-switch" data-lang-switch></span>
      <a class="btn btn-sm btn-ghost" href="/#bowls" data-i18n="nav.browse"></a>
      <a class="btn btn-sm btn-primary" href="/create.html" data-i18n="nav.create"></a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <img class="hero-bowl anim-settle" src="/img/bowl.svg" alt="A bowl put out on the table" />
      <h1 data-i18n-html="index.heroTitle"></h1>
      <p class="sub" data-i18n="index.heroSub"></p>
      <div class="hero-actions">
        <a class="btn btn-lg btn-primary" href="/create.html" data-i18n="nav.create"></a>
        <a class="btn btn-lg" href="#bowls" data-i18n="nav.browse"></a>
      </div>
      <p class="slogan" id="slogan"></p>
    </section>

    <section id="bowls">
      <h2 class="section-title"><span data-i18n="index.listTitle"></span> <small id="bowl-count"></small></h2>
      <div id="bowl-list" class="bowl-grid"></div>
      <div id="empty-box" class="empty hidden">
        <img src="/img/bowl.svg" alt="Empty bowl" />
        <h2 data-i18n="index.emptyTitle"></h2>
        <p data-i18n="index.emptySub"></p>
        <a class="btn btn-primary" href="/create.html" data-i18n="index.emptyCta"></a>
      </div>
      <div id="load-more" class="hidden" style="text-align:center; margin-top:26px;">
        <button class="btn btn-gold" id="load-more-btn" data-i18n="index.loadMore"></button>
      </div>
    </section>

    <section id="done-bowls" style="margin-top:56px;">
      <details class="done-box">
        <summary>
          <span data-i18n="index.doneSection"></span>
          <small id="done-count" class="hint"></small>
          <span class="caret">▾</span>
        </summary>
        <div id="done-list" class="bowl-grid" style="margin-top:18px;"></div>
      </details>
    </section>
  </main>

  <footer class="site-footer">
    <p>
      <span data-i18n="brand.footerTagline"></span> |
      <a href="https://github.com/cunzhangcrypto/fanwan" target="_blank" rel="noopener">GitHub (MIT)</a>
    </p>
    <p data-i18n="brand.footerNote1"></p>
    <p data-i18n="brand.footerNote2"></p>
  </footer>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/index.js"></script>
</body>
</html>
