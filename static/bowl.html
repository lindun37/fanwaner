<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>__TITLE__</title>
  <meta name="description" content="__META_DESC__" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="__TITLE__" />
  <meta property="og:description" content="__OG_DESC__" />
  <meta property="og:image" content="__OG_IMAGE__" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="__OG_URL__" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <img src="/img/logo.svg" alt="Fanwaner Logo" data-i18n-aria="brand.name" />
      <span><span data-i18n="brand.name"></span><small data-i18n="brand.tagline"></small></span>
    </a>
    <nav class="nav">
      <span class="lang-switch" data-lang-switch></span>
      <a class="btn btn-sm btn-ghost" href="/#bowls" data-i18n="nav.browse"></a>
      <a class="btn btn-sm btn-primary" href="/create.html" data-i18n="nav.create"></a>
    </nav>
  </header>

  <main>
    <div class="detail-wrap">
      <div id="loading" class="spinner"></div>

      <div id="detail" class="hidden">
        <div class="detail-card">
          <div class="detail-top">
            <img class="detail-bowl-img anim-settle" src="/img/bowl.svg" alt="Meal" />
            <div>
              <h1 class="detail-title" id="d-title"></h1>
              <div class="detail-amount"><span class="amt-state" id="d-state"></span> · <b id="d-current"></b> / <span id="d-target"></span></div>
              <span class="detail-status" id="d-status"></span>
            </div>
          </div>

          <div class="detail-progress">
            <div class="progress">
              <div class="fill" id="d-fill"></div>
              <span class="pct" id="d-pct"></span>
            </div>
            <p style="color:var(--ink-soft); font-size:14px; margin-top:8px; text-align:center;" id="d-progress-text"></p>
          </div>

          <div class="detail-desc">
            <p id="d-want" style="color:var(--ink-soft); margin-bottom:12px;"></p>
            <div class="why" id="d-reason"></div>
          </div>

          <div class="kv" id="d-kv"></div>

          <div class="detail-actions">
            <button class="btn btn-lg btn-primary" id="btn-donate" data-i18n="bowl.btnDonate"></button>
            <button class="btn btn-lg btn-gold" id="btn-share" data-i18n="bowl.btnShare"></button>
            <button class="btn btn-lg btn-ghost hidden" id="btn-edit" data-i18n="bowl.btnEdit"></button>
            <button class="btn btn-lg btn-ghost hidden" id="btn-manage-link" data-i18n="bowl.btnManageLink"></button>
          </div>
        </div>

        <section class="records">
          <div id="pending-section" class="hidden" style="margin-bottom:36px;">
            <h2 class="section-title">
              <span id="pending-title" data-i18n="bowl.pendingTitle"></span>
              <small id="pending-hint" data-i18n="bowl.pendingHint"></small>
            </h2>
            <div id="pending-list"></div>

            <div id="rejected-section" class="hidden" style="margin-top:24px;">
              <h2 class="section-title" style="font-size:20px;">
                <span data-i18n="bowl.rejectedTitle"></span>
                <small data-i18n="bowl.rejectedHint"></small>
              </h2>
              <div id="rejected-list"></div>
            </div>
          </div>

          <h2 class="section-title"><span data-i18n="bowl.recordsTitle"></span> <small id="r-count"></small></h2>
          <div id="record-list" class="record-list"></div>
          <div id="record-empty" class="empty hidden" style="padding:36px 20px;">
            <h2 style="font-size:20px;" data-i18n="bowl.recordsEmptyTitle"></h2>
            <p style="margin-bottom:0;" data-i18n="bowl.recordsEmptySub"></p>
          </div>

          <h2 class="section-title" style="margin-top:40px;" data-i18n="bowl.rankTitle"></h2>
          <div id="rank-list" class="rank-list"></div>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p data-i18n="brand.footerTagline"></p>
    <p data-i18n="brand.footerNote1"></p>
    <p data-i18n="brand.footerNote2"></p>
  </footer>

  <div class="modal-mask" id="donate-mask">
    <div class="modal" id="donate-modal">
      <button class="close" data-close aria-label="Close">×</button>

      <div id="step-pay">
        <h3 data-i18n="donate.stepPayTitle"></h3>
        <p class="lead" data-i18n="donate.stepPayLead"></p>
        <div class="pay-tabs" id="donate-pay-tabs"></div>
        <button class="btn btn-lg btn-primary" id="btn-next" style="width:100%;" data-i18n="donate.btnNext"></button>
      </div>

      <div id="step-report" class="hidden">
        <h3 id="r-pay-title" data-i18n="donate.stepReportTitle"></h3>
        <p class="lead" id="r-pay-lead" data-i18n="donate.stepReportLead"></p>

        <div id="r-qr-box" class="qr-box"></div>
        <div id="r-usdt-box" class="hidden">
          <div class="addr-label" id="r-usdt-net" style="font-size:13px; color:var(--red); font-weight:600; margin-top:6px;"></div>
          <div class="addr-box" id="r-usdt-addr"></div>
          <button class="btn btn-sm" id="btn-copy-usdt" data-i18n="donate.copyAddress"></button>
          <div class="alert alert-red" style="margin-top:12px;" data-i18n="pay.addrWarn"></div>
        </div>
        <div id="r-link-box" class="hidden">
          <a class="btn btn-gold" id="r-pay-link" target="_blank" rel="noopener noreferrer" style="width:100%;" href="#" data-i18n="donate.openPay"></a>
        </div>

        <p class="qr-tip" style="margin-top:12px;" id="r-report-tip"></p>

        <hr style="border:none; border-top:1.5px dashed var(--line); margin:18px 0;" />
        <div id="report-form">
          <div class="field">
            <label for="rd-nickname" data-i18n="donate.fieldNickname"></label>
            <input type="text" id="rd-nickname" maxlength="30" data-i18n-ph="donate.fieldNicknamePh" />
          </div>
          <div class="field">
            <label for="rd-amount"><span data-i18n="donate.fieldAmount"></span><span class="req">*</span></label>
            <input type="number" id="rd-amount" min="1" step="0.01" data-i18n-ph="donate.fieldAmountPh" />
          </div>
          <div class="field">
            <label for="rd-message" data-i18n="donate.fieldMessage"></label>
            <input type="text" id="rd-message" maxlength="200" data-i18n-ph="donate.fieldMessagePh" />
          </div>
          <div class="field hidden" id="rd-txid-field">
            <label for="rd-txid"><span data-i18n="donate.fieldTxid"></span> <span class="hint" data-i18n="donate.fieldTxidHint"></span></label>
            <input type="text" id="rd-txid" maxlength="128" data-i18n-ph="donate.fieldTxidPh" />
          </div>
          <div class="field">
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
              <input type="checkbox" id="rd-anon" style="width:18px;height:18px;" />
              <span data-i18n="donate.fieldAnon"></span>
            </label>
            <span class="hint" data-i18n="donate.fieldAnonHint"></span>
          </div>
          <div class="turnstile-wrap" id="turnstile-wrap"></div>
          <button class="btn btn-lg btn-primary" id="btn-submit-donation" style="width:100%;" data-i18n="donate.submit"></button>
        </div>
      </div>

      <div id="step-done" class="hidden" style="text-align:center;">
        <div class="ding-scene" id="ding-scene">
          <div class="rice"></div>
          <div class="rice"></div>
          <div class="rice"></div>
          <img class="ding-bowl" src="/img/bowl.svg" alt="Meal" />
        </div>
        <p class="ding-text" id="done-title"></p>
        <p style="color:var(--ink-soft);" id="done-sub"></p>
        <div class="btn-row" style="justify-content:center; margin-top:18px;">
          <button class="btn btn-gold" data-close data-i18n="donate.doneClose"></button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="share-mask">
    <div class="modal" style="text-align:center;">
      <button class="close" data-close aria-label="Close">×</button>
      <h3 data-i18n="share.title"></h3>
      <p class="lead" data-i18n="share.lead"></p>
      <div class="alert" style="font-size:13px; word-break:break-all;" id="share-url"></div>
      <button class="btn btn-gold" id="btn-copy-share" style="width:100%;" data-i18n="share.copyBtn"></button>
      <p style="color:var(--muted); font-size:13px; margin-top:12px;" id="share-copied" class="hidden" data-i18n="share.copied"></p>
    </div>
  </div>

  <link rel="preconnect" href="https://challenges.cloudflare.com" crossorigin />
  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/bowl.js"></script>
</body>
</html>
