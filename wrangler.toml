# 饭碗儿 —— Cloudflare Worker 配置
# 部署前需要：wrangler d1 create fanwaner / wrangler r2 bucket create fanwaner-assets，
# 把 database_id 填到下面；再 wrangler secret put 三个密钥（见 .env.example）。

name = "fanwaner"
main = "src/index.js"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]

# 静态资源：所有请求先过 Worker（run_worker_first），由 Worker 分流 /api/* 与静态页
# html_handling = "none"：不做 .html 的 clean-url 重定向，保证 /bowl.html 能被 Worker 注入 OG meta
assets = { directory = "./static", binding = "ASSETS", run_worker_first = true, not_found_handling = "none", html_handling = "none" }

# 可选：绑自定义域名（不配就用 workers.dev 域名）
# routes = [{ pattern = "fanwaner.example.com", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "fanwaner"
database_id = "" # 填 wrangler d1 create 生成的 id
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "fanwaner-assets"

[vars]
TURNSTILE_SITE_KEY = "" # Turnstile 站点公开 sitekey
MAX_AMOUNT_YUAN = 1000 # 兼容旧字段：CNY 场景下的金额上限（元）
MAX_UPLOAD_BYTES = 2097152 # 图片上传大小上限（2MB）
R2_FONT_KEY = "fonts/NotoSansSC-Regular.otf" # OG 图用的中文字体在 R2 的 key
# 海外场景建议改用拉丁字体（体积小很多，约 300KB）：
# R2_FONT_KEY = "fonts/NotoSans-Regular.ttf"
SITE_URL = "" # 站点域名（不带结尾斜杠），如 https://fanwaner.example.com，用于 OG 分享图链接

# ---- i18n（新增）----
DEFAULT_LOCALE = "en"      # 默认界面语言：en / zh。面向海外用户保持 en
DEFAULT_CURRENCY = "USD"   # 新饭碗儿的默认币种（用户仍可自选）
NTFY_API = "https://ntfy.sh" # ntfy 自建服务地址，用官方就留默认

# ---- 投喂是否免放行（新增）----
# "true" （默认）：投喂直接上墙、立刻计账并公开显示，碗主人事后仍可「拒了」（金额自动扣回）
# "false"        ：回到「先 pending，碗主人放行后才显示」的审核流
AUTO_APPROVE_DONATIONS = "true"
