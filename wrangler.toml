# Fanwaner — Cloudflare Worker configuration
# Before deploying: run `wrangler d1 create fanwaner` and `wrangler r2 bucket create fanwaner-assets`,
# paste the generated database_id below, then set the secrets with `wrangler secret put`
# (see .env.example for the full list).

name = "fanwaner"
main = "src/index.js"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]

# Static assets: every request runs through the Worker first (run_worker_first), which then
# routes /api/* and static pages.
# html_handling = "none" disables clean-url redirects so that /bowl.html reaches the Worker,
# which is what lets us inject localized Open Graph meta tags.
assets = { directory = "./static", binding = "ASSETS", run_worker_first = true, not_found_handling = "none", html_handling = "none" }

# Optional: bind a custom domain (otherwise the workers.dev domain is used)
# routes = [{ pattern = "fanwaner.example.com", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "fanwaner"
database_id = "" # paste the id printed by `wrangler d1 create`
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "fanwaner-assets"

[vars]
TURNSTILE_SITE_KEY = "" # public Turnstile sitekey
MAX_AMOUNT_YUAN = 1000 # per-donation cap, expressed in MAJOR units of the chosen currency
                       # (USD -> 1000 dollars, JPY -> 1000 yen). The name is kept for
                       # backwards compatibility; it is not CNY-specific.
MAX_UPLOAD_BYTES = 2097152 # image upload size limit (2MB)
R2_FONT_KEY = "fonts/NotoSansSC-Regular.otf" # R2 key of the font used to render OG images
# For non-Chinese deployments switch to a Latin font (much smaller, ~300KB):
# R2_FONT_KEY = "fonts/NotoSans-Regular.ttf"
# The font family name is derived from R2_FONT_KEY automatically
# (NotoSans-Regular.ttf -> NotoSans), so you normally don't need OG_FONT_NAME.
# Set it explicitly only when the R2 key doesn't match the font's internal name:
# OG_FONT_NAME = "NotoSans"
SITE_URL = "" # site origin without a trailing slash, e.g. https://fanwaner.example.com, used for OG share image URLs

# ---- i18n ----
DEFAULT_LOCALE = "en"      # default UI language: en / zh. Keep "en" for overseas audiences.
DEFAULT_CURRENCY = "USD"   # default currency for new bowls (owners can still change it)
NTFY_API = "https://ntfy.sh" # ntfy server base URL; leave as-is to use the public service

# ---- Donation auto-approval ----
# "true"  (default): donations go live immediately, are counted and shown in public right away.
#                    The bowl owner can still reject them afterwards (amount is deducted again).
# "false"           : legacy moderation flow — donation stays "pending" until the owner approves it.
AUTO_APPROVE_DONATIONS = "true"
